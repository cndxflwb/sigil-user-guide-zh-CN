<!DOCTYPE html>

<head>
  <title>剪贴板</title>
  <link href="../Styles/styles.css" type="text/css" rel="stylesheet"/>
</head>

<body>
  <h2 id="clipboard_history">剪贴板历史</h2>

  <p class="h2subheading">— 剪贴板列表 —</p>

  <p>剪贴板历史可快速访问最近复制或剪切的文本。</p>

  <p>要将文本添加到剪贴板，只需使用复制或剪切。</p>

  <p>要从剪贴板粘贴文本，请选择 <span class="menuitem">编辑=&gt;从剪贴板历史粘贴</span> 或相应快捷键：</p>

  <div class="image">
    <img alt="Clipboard History  dialog of recent contents of the clipboard." src="../Images/clipboard-history.png"/>
  </div>

  <p>点击要使用的文本，即会粘贴到您最后选定的窗口，对话框也会自动关闭。</p>

  <p>也可直接键入条目旁显示的字符加以选择。</p>

  <p>要从该历史中删除条目，选中相应条目并按删除键即可。如需移除特别大的剪贴板副本以节省空间，或删除不再需要的条目，这一功能十分有用。</p>
</body>
</html>
