<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" lang="zh-CN" xml:lang="zh-CN">
<head>
  <title>特殊字符</title>
  <link href="../Styles/styles.css" type="text/css" rel="stylesheet"/>
</head>

<body>
  <h2 id="find_and_replace">特殊字符</h2>

  <p class="h2subheading">— 插入特殊字符 —</p>

  <p>您可以使用特殊字符对话框，轻松地将键盘上可能没有的字符插入文档。</p>

  <p>要插入特殊字符，请点击 插入特殊字符 按钮<img class="toolbar-icon" alt="Image of Insert Special Character icon." src="../Images/insert-special-character-icon.png"/>，或选择菜单项 <span class="menuitem">插入=&gt;特殊字符</span>。</p>

  <div class="image">
    <img alt="Image of a table of Special Characters to select for insertion." src="../Images/insert-special-character.png" style="width:60%"/>
  </div>

  <p>该对话框会保持打开状态，允许您多次插入文本，您也可以将窗口移动到屏幕上任意位置。</p>

  <div class="tip">
    <p class="tiptext">您可以按住 <span class="shortcut">Ctrl</span> 键点击来选择并插入字符，同时立即关闭对话框窗口。</p>
  </div>

  <p>当您将鼠标悬停在某个字符上时，会看到一个工具提示，其中列出该字符的 HTML 实体代码及描述：</p>

  <div class="image">
    <img alt="Showing tool tips in the Insert Special Character dialog." src="../Images/special-character-tooltip.png"/>
  </div>

  <p>您可以在<a href="../Text/preferences.xhtml#preferences_appearance">首选项</a>中更改对话框内字符的字体和大小。</p>

  <p>某些字符在某些字体中可能无法正确显示。</p>

  <div class="tip">
    <p class="tiptext">您还可以为常用的特殊字符创建剪贴板按钮和快捷键。</p>
  </div>
</body>
</html>
